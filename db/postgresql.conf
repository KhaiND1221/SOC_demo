# Minimal postgresql.conf for the SOC Logging Lab.
# This file fully replaces the image's default config (passed via
# `-c config_file=...`), so it intentionally includes the handful of
# settings needed for the container to run plus the audit-log settings
# the lab is built around.

listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
max_connections = 100
shared_buffers = 128MB

# ---- Logging: this is the part the lab cares about ----
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_min_messages = warning
log_min_error_statement = error

# Only log data-modifying statements (INSERT/UPDATE/DELETE), NOT SELECT.
# This is deliberate: it lets you compare an audited write (visible here)
# against an unaudited read (only visible in the FastAPI app log as an
# "order_read" event) -- see LOGGING_MAP.md.
log_statement = 'mod'
log_duration = off
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
