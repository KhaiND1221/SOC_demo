user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom access log format for the SOC lab.
    # request_id is nginx's built-in per-request random id; it is forwarded
    # to the backend as the X-Request-ID header so the same value shows up
    # in the FastAPI structured logs too -- this is the primary field used
    # to correlate a single request across the Nginx and Application layers.
    log_format soclab escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"scheme":"$scheme",'
        '"request_method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"session_id":"$cookie_session_id",'
        '"referer":"$http_referer"'
        '}';

    access_log  /var/log/nginx/access.log  soclab;

    sendfile        on;
    keepalive_timeout  65;

    # Port 80: redirect everything to HTTPS. NOTE: the ":8443" below is the
    # HOST port a browser must come back to (NGINX_HTTPS_PORT in .env) - it
    # can't be derived from $host, so if you change NGINX_HTTPS_PORT in .env
    # you must update this literal too.
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # Self-signed cert for local HTTPS demo (see nginx/ssl/README.md).
        # Browsers will show a "not trusted" warning for self-signed certs
        # - that is expected, click through it. Real deployments need a
        # cert from a trusted CA (e.g. Let's Encrypt) instead.
        ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
