<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile - Task Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topnav">
    <a href="/index.html" class="brand">
      <span class="logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      Task Manager
    </a>
    <nav class="nav-links">
      <a href="/index.html" data-page="home">Home</a>
      <a href="/tasks.html" data-page="tasks">Tasks</a>
      <a href="/profile.html" data-page="profile">Profile</a>
    </nav>
    <div class="user-area" id="user-area"></div>
  </header>

  <main class="page">
    <span class="eyebrow">TÀI KHOẢN</span>
    <h1>Hồ sơ cá nhân</h1>
    <p class="subtitle" id="load-msg" style="margin-bottom:20px;"></p>

    <div class="profile-grid">
      <div class="card profile-side">
        <div class="avatar-lg" id="avatar-initials">–</div>
        <h2 id="disp-username" style="margin:4px 0 2px; font-size:18px;">–</h2>
        <p class="muted" id="disp-created">–</p>
      </div>

      <div>
        <div class="card">
          <h3 class="section-title">Thông tin tài khoản</h3>
          <label for="disp-username-field">Username</label>
          <input id="disp-username-field" type="text" disabled />
          <label for="disp-email">Email</label>
          <input id="disp-email" type="text" disabled />
        </div>

        <div class="card">
          <h3 class="section-title">Cập nhật thông tin</h3>
          <label for="email">Email mới (để trống nếu không đổi)</label>
          <input id="email" type="email" />

          <label for="password">Mật khẩu mới (để trống nếu không đổi)</label>
          <input id="password" type="password" />

          <button id="save-btn">Lưu thay đổi</button>
          <p id="save-msg" class="message"></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">Task Manager — ứng dụng quản lý công việc cá nhân</footer>

  <script src="/js/api.js"></script>
  <script>
    renderNavUser("user-area");
    markActiveNav("profile");
    const stored = getStoredUser();

    async function loadProfile() {
      const msgEl = document.getElementById("load-msg");

      if (!stored) {
        showMessage(msgEl, "Bạn chưa đăng nhập.", true);
        return;
      }

      const res = await apiFetch(`/users/${stored.id}`);
      if (!res.ok) {
        showMessage(msgEl, `Error ${res.status}`, true);
        return;
      }

      const user = res.data;
      document.getElementById("avatar-initials").textContent = user.username.slice(0, 2).toUpperCase();
      document.getElementById("disp-username").textContent = user.username;
      document.getElementById("disp-created").textContent = `Tham gia ${new Date(user.created_at).toLocaleDateString("vi-VN")}`;
      document.getElementById("disp-username-field").value = user.username;
      document.getElementById("disp-email").value = user.email;
    }

    document.getElementById("save-btn").addEventListener("click", async () => {
      const msgEl = document.getElementById("save-msg");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const body = {};
      if (email) body.email = email;
      if (password) body.password = password;

      const res = await apiFetch(`/users/${stored.id}`, { method: "PUT", body: JSON.stringify(body) });
      showMessage(msgEl, res.ok ? "Profile updated." : `Error ${res.status}: ${JSON.stringify(res.data && res.data.detail)}`, !res.ok);
      if (res.ok) {
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
        loadProfile();
      }
    });

    loadProfile();
  </script>
</body>
</html>
