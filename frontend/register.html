<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Register - Task Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="icon-badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      </div>
      <h1>Create Account</h1>
      <p class="subtitle muted">Đăng ký để bắt đầu quản lý công việc.</p>

      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" />

      <label for="password">Password (min 8 chars)</label>
      <input id="password" type="password" autocomplete="new-password" />

      <button id="register-btn">Register</button>
      <p id="msg" class="message"></p>

      <div class="auth-footer">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("register-btn").addEventListener("click", async () => {
      const msgEl = document.getElementById("msg");
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const res = await apiFetch("/auth/register", {
        method: "POST",
        body: JSON.stringify({ username, email, password }),
      });

      if (res.ok) {
        showMessage(msgEl, `Registered user '${res.data.username}'. You can now log in.`);
      } else {
        showMessage(msgEl, `Error ${res.status}: ${JSON.stringify(res.data && res.data.detail)}`, true);
      }
    });
  </script>
</body>
</html>
