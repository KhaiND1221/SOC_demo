<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tasks - SOC Logging Lab</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/register.html">Register</a>
    <a href="/login.html">Login</a>
    <a href="/profile.html">Profile</a>
    <a href="/tasks.html">Tasks</a>
  </nav>

  <h1>Tasks</h1>
  <p class="muted" id="user-badge"></p>

  <h2>My tasks</h2>
  <div class="card">
    <button id="refresh-btn">Refresh list</button>
    <table id="tasks-table">
      <thead>
        <tr><th>Title</th><th>Priority</th><th>Status</th><th>Due date</th><th>Actions</th></tr>
      </thead>
      <tbody id="tasks-body"></tbody>
    </table>
    <p id="list-msg" class="message"></p>
  </div>

  <h2>Create task</h2>
  <div class="card">
    <label for="c-title">Title</label>
    <input id="c-title" type="text" />
    <label for="c-description">Description</label>
    <input id="c-description" type="text" />
    <label for="c-priority">Priority</label>
    <select id="c-priority">
      <option value="low">low</option>
      <option value="medium" selected>medium</option>
      <option value="high">high</option>
    </select>
    <label for="c-status">Status</label>
    <select id="c-status">
      <option value="todo" selected>todo</option>
      <option value="doing">doing</option>
      <option value="done">done</option>
    </select>
    <label for="c-due">Due date (optional)</label>
    <input id="c-due" type="date" />
    <button id="create-btn">Create</button>
    <p id="create-msg" class="message"></p>
  </div>

  <h2>Lookup / edit by task ID (try another user's task id to test IDOR -> expect 403)</h2>
  <div class="card">
    <label for="lookup-id">Task ID</label>
    <input id="lookup-id" type="text" />
    <button id="get-btn" class="secondary">GET</button>
    <button id="delete-btn" class="danger">DELETE</button>
    <pre id="lookup-out"></pre>

    <label for="u-status">New status (PUT update)</label>
    <select id="u-status">
      <option value="">-- no change --</option>
      <option value="todo">todo</option>
      <option value="doing">doing</option>
      <option value="done">done</option>
    </select>
    <button id="update-btn">PUT update status</button>
    <p id="lookup-msg" class="message"></p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    renderUserBadge("user-badge");

    async function loadTasks() {
      const msgEl = document.getElementById("list-msg");
      const body = document.getElementById("tasks-body");
      const res = await apiFetch("/tasks");

      if (!res.ok) {
        showMessage(msgEl, `Error ${res.status}`, true);
        return;
      }

      body.innerHTML = "";
      res.data.forEach((t) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${t.title}</td>
          <td>${t.priority}</td>
          <td>${t.status}</td>
          <td>${t.due_date || "-"}</td>
          <td class="row-actions">
            <button class="secondary" data-id="${t.id}" data-action="view">View</button>
            <button class="danger" data-id="${t.id}" data-action="delete">Delete</button>
          </td>`;
        body.appendChild(tr);
      });
      showMessage(msgEl, `Loaded ${res.data.length} task(s).`);
    }

    document.getElementById("refresh-btn").addEventListener("click", loadTasks);

    document.getElementById("tasks-body").addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const id = btn.dataset.id;

      if (btn.dataset.action === "view") {
        document.getElementById("lookup-id").value = id;
        document.getElementById("get-btn").click();
      } else if (btn.dataset.action === "delete") {
        await apiFetch(`/tasks/${id}`, { method: "DELETE" });
        loadTasks();
      }
    });

    document.getElementById("create-btn").addEventListener("click", async () => {
      const msgEl = document.getElementById("create-msg");
      const due = document.getElementById("c-due").value;
      const res = await apiFetch("/tasks", {
        method: "POST",
        body: JSON.stringify({
          title: document.getElementById("c-title").value.trim(),
          description: document.getElementById("c-description").value.trim() || null,
          priority: document.getElementById("c-priority").value,
          status: document.getElementById("c-status").value,
          due_date: due || null,
        }),
      });
      showMessage(msgEl, res.ok ? "Task created." : `Error ${res.status}: ${JSON.stringify(res.data && res.data.detail)}`, !res.ok);
      if (res.ok) loadTasks();
    });

    document.getElementById("get-btn").addEventListener("click", async () => {
      const out = document.getElementById("lookup-out");
      const id = document.getElementById("lookup-id").value.trim();
      const res = await apiFetch(`/tasks/${id}`);
      out.textContent = `HTTP ${res.status}\n` + JSON.stringify(res.data, null, 2);
    });

    document.getElementById("delete-btn").addEventListener("click", async () => {
      const msgEl = document.getElementById("lookup-msg");
      const id = document.getElementById("lookup-id").value.trim();
      const res = await apiFetch(`/tasks/${id}`, { method: "DELETE" });
      showMessage(msgEl, res.status === 204 ? "Deleted." : `Error ${res.status}`, res.status !== 204);
      loadTasks();
    });

    document.getElementById("update-btn").addEventListener("click", async () => {
      const msgEl = document.getElementById("lookup-msg");
      const id = document.getElementById("lookup-id").value.trim();
      const status = document.getElementById("u-status").value;
      if (!status) { showMessage(msgEl, "Pick a status first.", true); return; }

      const res = await apiFetch(`/tasks/${id}`, { method: "PUT", body: JSON.stringify({ status }) });
      showMessage(msgEl, res.ok ? "Task updated." : `Error ${res.status}: ${JSON.stringify(res.data && res.data.detail)}`, !res.ok);
      if (res.ok) loadTasks();
    });

    loadTasks();
  </script>
</body>
</html>
